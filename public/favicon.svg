<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5deb3" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#b8965a" />
      <stop offset="100%" stop-color="#8c6d3b" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#b8965a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#b8965a" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#b8965a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#b8965a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="2" />
  
  <!-- Subtle center gold glow -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)" />

  <!-- Stylized Serif Monogram 'L' with clean geometry -->
  <!-- Vertical serif top & stem -->
  <path d="M 21 16 L 31 16 L 31 19 L 28 19 L 28 42 L 44 42 L 44 38 L 47 38 L 47 48 L 21 48 L 21 44 L 24 44 L 24 19 L 21 19 Z" fill="url(#gold)" />
  
  <!-- Sparkle star accent at top right -->
  <path d="M 44 14 Q 44 19 49 19 Q 44 19 44 24 Q 44 19 39 19 Q 44 19 44 14 Z" fill="url(#gold)" />
</svg>
